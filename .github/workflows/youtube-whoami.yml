name: "YouTube who-am-I (manual, read-only)"

# 2026-11-01: prints which Google Cloud PROJECT NUMBER our YOUTUBE_CREDENTIALS client belongs to (the number before the first dash of the
# client_id, which is not secret) and the title of the channel that token controls. Never prints the token or client secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
      YOUTUBE_CREDENTIALS_TECH: ${{ secrets.YOUTUBE_CREDENTIALS_TECH }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-api-python-client google-auth
      - name: Project number and channel title
        run: |
          python - <<'PYEOF'
          import os, json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          for env in ("YOUTUBE_CREDENTIALS", "YOUTUBE_CREDENTIALS_TECH"):
              v = os.environ.get(env, "")
              if not v:
                  print(env, "NOT SET")
                  continue
              raw = json.loads(v)
              print(env, "PROJECT_NUMBER:", raw.get("client_id", "").split("-")[0])
              yt = build("youtube", "v3", credentials=Credentials.from_authorized_user_info(raw))
              r = yt.channels().list(part="snippet,statistics", mine=True).execute()
              for c in r.get("items", []):
                  print(env, "CHANNEL:", c["snippet"]["title"], c["id"], "videos:", c["statistics"].get("videoCount"))
          PYEOF
