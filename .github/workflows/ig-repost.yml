name: "Instagram re-post of a Facebook Reel (manual)"

# 2026-11-03: manual only. Re-sends an already published AI360 Technology Facebook Reel to Instagram ONLY (the normal upload's Instagram step had failed).
# Makes no new video and posts nothing to Facebook. Run it once per Reel, and only if the Instagram post does not already exist.

on:
  workflow_dispatch:
    inputs:
      fb_video_id:
        description: "Facebook Reel video id (phone_heat = 1140217788480759)"
        required: true

permissions:
  contents: read

concurrency:
  group: ig-repost
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Re-post to Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID_TECH: ${{ secrets.FACEBOOK_PAGE_ID_TECH }}
          INSTAGRAM_ID_TECH: ${{ secrets.INSTAGRAM_ID_TECH }}
          FB_VIDEO_ID: ${{ github.event.inputs.fb_video_id }}
        run: python ig_repost.py
