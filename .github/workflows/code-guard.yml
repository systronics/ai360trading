name: Code guard (call mismatches)
# 2026-11-06: a keyword-argument typo hid for 3.5 months in trading_bot.py (swallowed by try/except). This catches that class of bug on every Python change.
on:
  push:
    paths: ['**.py', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python check_calls.py
