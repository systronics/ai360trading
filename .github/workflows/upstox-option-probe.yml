name: Upstox option-chain probe (manual, read-only)
# 2026-11-07: shows which option-chain fields the free Analytics Token returns (OI, previous OI, volume, IV, greeks, PCR). Writes nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python upstox_option_probe.py
