name: Long-Term Investment Signals

# v1.0 (May 2026):
#   Weekly scanner for quality stocks (Nifty100 + curated LTWatchlist).
#   Business goal: free signal in CHAT_ID_BASIC to attract new followers.
#   Full analysis (entry zone, SL, target, reasons) → Advance + Premium only.
#   Runs Sunday 9:00 AM IST so followers get picks before Monday market open.

on:
  schedule:
    # Sunday 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * 0'
  workflow_dispatch:

jobs:
  longterm-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Long-Term Signal Scanner
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID_BASIC:            ${{ secrets.CHAT_ID_BASIC }}
          CHAT_ID_ADVANCE:          ${{ secrets.CHAT_ID_ADVANCE }}
          CHAT_ID_PREMIUM:          ${{ secrets.CHAT_ID_PREMIUM }}
        run: python generate_longterm.py

      # 2026-07-31: publish PositionalLatest to a static _data/*.json file for
      # positional-picks.html, same doctrine as publish_swing_board.py — see
      # that file's header comment for why (SwingPublic's "Publish to web"
      # link broke silently once already; positional-picks.html was still on
      # the same fragile mechanism as a client-side fallback only, closing
      # that gap proactively). Runs right after PositionalLatest is rewritten.
      - name: Publish positional picks JSON
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python publish_positional.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "admin@ai360trading.in"
          git config --local user.name "AI360-Automation"
          git add _data/positional.json
          git diff --cached --quiet || git commit -m "📈 Positional picks refresh: $(date +'%Y-%m-%d %H:%M') IST"
          git push origin master
