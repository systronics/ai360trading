name: "Price freshness watchdog (market hours, warns the owner)"

# 2026-11-05: compares the sheet's CMP with Yahoo's live price every 20 min between 09:25 and 15:30 IST and sends a Telegram warning to the PREMIUM
# channel (owner only) when the feed is stale, plus one 'feed is live' confirmation after 09:45. Read-only: never writes the sheet, signals or trades.
# Why: on 2, 3 and 4 Nov the live-price session only started at ~15:14 IST, so CMP was yesterday's close all day and nobody noticed
# ('workflow success' does not prove the DATA is fresh). Started by the trading-bot session's kick step (workflow_dispatch, not delayed) and it chains
# its own successor like the other session loops. Fail-open, continue-on-error everywhere.

concurrency:
  group: price-watch
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      end_time:
        description: "Loop end time, IST HH:MM"
        required: false
        default: "15:35"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 235
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread==6.2.1 oauth2client==4.1.3 pytz==2026.2 yfinance==1.4.1 pandas==3.0.3
      - name: Watch loop
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID_PREMIUM: ${{ secrets.CHAT_ID_PREMIUM }}
          END_TIME: ${{ github.event.inputs.end_time }}
        run: |
          export TZ=Asia/Kolkata
          END="${END_TIME:-15:35}"
          echo "[WATCH] start $(date '+%F %T') until ${END} IST"
          while [ "$(date +%H:%M)" \< "$END" ]; do
            python -u price_freshness.py || echo "[WATCH] check exited non-zero, continuing"
            if [ "$(date +%H:%M)" \< "$END" ]; then sleep 1200; fi
          done
          echo "[WATCH] reached ${END}"
      - name: Chain the next watch session
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TZ=Asia/Kolkata
          if [ "$(date +%u)" -le 5 ] && [ "$(date +%H:%M)" \< "15:30" ]; then
            LIM=$(( $(date +%s) + 215 * 60 )); E=$(date -d "today 15:35" +%s)
            [ "$LIM" -gt "$E" ] && LIM=$E
            NEXT_END=$(date -d "@$LIM" +%H:%M)
            gh workflow run price_watch.yml -f end_time="$NEXT_END" || echo "[CHAIN] dispatch failed"
            echo "[CHAIN] successor dispatched, ends $NEXT_END IST"
          fi
