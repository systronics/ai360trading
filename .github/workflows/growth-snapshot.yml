name: Growth snapshot (daily audience numbers)

# 2026-10-31: one row per day in _data/growth_history.json (YouTube subs/views, Facebook + Instagram followers,
# Telegram members). Read-only API calls, no token printed, fail-open. Commits only that file.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: growth-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID_BASIC: ${{ secrets.CHAT_ID_BASIC }}
      CHAT_ID_ADVANCE: ${{ secrets.CHAT_ID_ADVANCE }}
      CHAT_ID_PREMIUM: ${{ secrets.CHAT_ID_PREMIUM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Take the snapshot
        run: python growth_snapshot.py
      - name: Commit the history
        run: |
          git config --local user.email "admin@ai360trading.in"
          git config --local user.name "AI360-Automation"
          git add _data/growth_history.json
          git diff --cached --quiet || git commit -m "Growth snapshot: $(date +'%Y-%m-%d')"
          git pull --rebase origin master || true
          git push origin master || true
