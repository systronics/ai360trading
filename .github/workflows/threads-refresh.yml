name: "Threads token refresh (every 2 weeks)"

# A Threads long-lived token lives 60 days and can be refreshed only while it is at least 24 hours old and not yet expired. This refreshes it every 2 weeks (a refresh restarts the 60-day clock) and stores the new
# token in the GitHub secret THREADS_ACCESS_TOKEN (needs the repo secret GH_TOKEN, the same PAT token_refresh.py uses). With no THREADS_ACCESS_TOKEN it does nothing.

on:
  schedule:
    - cron: "41 3 1,15 * *"
  workflow_dispatch:

concurrency:
  group: threads-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pytz PyNaCl
      - name: Refresh
        run: python threads_post.py --refresh
