name: Bhavcopy Cache Refresh

# v1.0 (May 2026):
#   Daily NSE bhavcopy + option-chain fetcher. Populates BotMemory:
#     DLV_{SYM}          — delivery % per equity (from sec_bhavdata_full.csv)
#     MKT_PCR_NIFTY      — today's Nifty options PCR (open interest)
#     MKT_PCR_BANKNIFTY  — today's BankNifty options PCR
#
#   Consumer: institutional_edges.py (delivery filter + PCR regime filter).
#
#   Schedule: Mon-Fri 20:00 IST = 14:30 UTC. NSE archives publish bhavcopy
#   around 18:30 IST; we give 1.5h buffer.

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      fo_date:
        description: "Optional: run the F&O buildup for this date (YYYY-MM-DD), e.g. 2026-10-30"
        required: false
        default: ""
      fo_tg:
        description: "yes = also send the F&O summary to the Premium channel now (test)"
        required: false
        default: ""
      fo_write:
        description: "yes = write the F&O buildup columns now (default follows repo variable FO_BUILDUP_MODE)"
        required: false
        default: ""

jobs:
  fetch-bhavcopy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bhavcopy fetcher
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID_BASIC:            ${{ secrets.CHAT_ID_BASIC }}
          CHAT_ID_PREMIUM:            ${{ secrets.CHAT_ID_PREMIUM }}
        run: python fetch_bhavcopy.py

      # 2026-11-01 owner task: F&O buildup columns + Sector_Board (INFORMATIONAL ONLY, never read by any gate/alert).
      # Dry-run (prints only) until the owner sets repo variable FO_BUILDUP_MODE=write. continue-on-error: it must never affect the step above.
      - name: F&O buildup (Nifty200 columns + Sector_Board + BuildupWatch)
        continue-on-error: true
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID_BASIC:            ${{ secrets.CHAT_ID_BASIC }}
          CHAT_ID_PREMIUM:          ${{ secrets.CHAT_ID_PREMIUM }}
          FO_TELEGRAM: ${{ vars.FO_TELEGRAM || '' }}
          FO_TG: ${{ github.event.inputs.fo_tg || '' }}
          FO_DATE:  ${{ github.event.inputs.fo_date || '' }}
          FO_WRITE: ${{ github.event.inputs.fo_write || vars.FO_BUILDUP_MODE || '' }}
        run: |
          ARGS=""
          if [ -n "$FO_DATE" ]; then ARGS="$ARGS --date $FO_DATE"; fi
          if [ "$FO_WRITE" = "write" ] || [ "$FO_WRITE" = "yes" ]; then ARGS="$ARGS --write"; fi
          if [ "$FO_TG" = "yes" ]; then ARGS="$ARGS --tg-test"; fi
          python fetch_fo_buildup.py $ARGS

      # 2026-11-02: Gate Audit (research log of every Nifty200+F&O stock vs our gates + forward returns). OBSERVATION ONLY, never read by any gate/alert.
      # Idempotent; continue-on-error so it can never affect the steps above. Yahoo may not have the day yet -> it then skips (fail-open).
      - name: Gate Audit (observation only)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python gate_audit.py --write

      # 2026-11-05: daily top-gainers record (what we knew the evening before, was it a leader / laggard bounce / result, did the system take it). Observation only.
      - name: Gainers log (observation only)
        continue-on-error: true
        timeout-minutes: 6
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python gainers_log.py --write

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID_BASIC:      ${{ secrets.CHAT_ID_BASIC }}
          WF_NAME:            "${{ github.workflow }}"
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import os, json
          from urllib.request import Request, urlopen
          token = os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat  = (os.environ.get('CHAT_ID_PREMIUM','') or os.environ.get('CHAT_ID_BASIC',''))
          if not token or not chat:
              print('[NOTIFY] Telegram creds missing — skip'); raise SystemExit(0)
          msg = (
              "⚠️ <b>System Notice — AI360Trading</b>\n\n"
              f"Workflow failed: <b>{os.environ.get('WF_NAME','?')}</b>\n"
              f"Run log: {os.environ.get('RUN_URL','')}\n\n"
              "<i>This is a system message, not a trade signal. "
              "Engineer will investigate. Existing bhavcopy cache continues to serve filters.</i>"
          )
          try:
              req = Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=json.dumps({'chat_id':chat,'text':msg,'parse_mode':'HTML'}).encode(),
                  headers={'Content-Type':'application/json'},
              )
              urlopen(req, timeout=10).read()
              print('[NOTIFY] Failure alert sent to Basic channel')
          except Exception as e:
              print(f'[NOTIFY] Send failed: {e}')
          PYEOF
