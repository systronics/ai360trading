name: "Life stories test (manual, never uploads)"

# 2026-10-31: writes N Hindi-first moral micro-stories with the free AI chain and renders them (dry) with real footage:
# English edition + Hindi edition per story. Uploads NOTHING, publishes NOTHING; output is an artifact for the owner to review.
# LIFE_STORIES=1 keeps this series out of the AI360Trading story queue.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many stories to write (render the first RENDER of them)"
        required: false
        default: "3"
      render:
        description: "How many to render as videos"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  life:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIFE_STORIES: "1"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu fonts-liberation fonts-freefont-ttf
      - name: Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write the stories (saved only inside this job)
        run: python life_stories.py --n "${{ github.event.inputs.count || '3' }}" --save --print
      - name: Render the first stories (dry, both editions)
        run: |
          python - <<'PYEOF'
          import os, json, subprocess
          keys = [s["key"] for s in json.load(open("_data/life_extra.json", encoding="utf-8"))["stories"]]
          n = int(os.environ.get("RENDER", "2"))
          for k in keys[:n]:
              subprocess.run(["python", "story_real.py", "--run", "--mode", "dry", "--story", k, "--out", "output/life"], check=False)
          PYEOF
        env:
          RENDER: ${{ github.event.inputs.render || '2' }}
      - uses: actions/upload-artifact@v4
        with:
          name: life-preview
          path: |
            output/life/*.mp4
            output/life/*_thumb.jpg
            output/life/*_meta*.json
            _data/life_extra.json
          retention-days: 7
          if-no-files-found: ignore
