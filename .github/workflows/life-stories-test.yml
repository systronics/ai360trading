name: "Life stories test (manual, never uploads)"

# 2026-10-31: writes N Hindi-first moral micro-stories with the free AI chain and renders them (dry) with real footage:
# English edition + Hindi edition per story. Uploads NOTHING, publishes NOTHING; output is an artifact for the owner to review.
# LIFE_STORIES=1 keeps this series out of the AI360Trading story queue.

on:
  workflow_dispatch:
    inputs:
      stories:
        description: "Space-separated story keys from _data/life_extra.json (life_maa life_imaandari life_sabr life_shukriya life_rishte life_waqt)"
        required: false
        default: "life_maa life_imaandari"

permissions:
  contents: read

jobs:
  life:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LIFE_STORIES: "1"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu fonts-liberation fonts-freefont-ttf
      - name: Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render the hand-written Hindi stories (dry, Hindi edition only, never uploads)
        run: |
          for k in ${{ github.event.inputs.stories || 'life_maa life_imaandari' }}; do
            python story_real.py --life --mode dry --story "$k" --out output/life
          done
      - uses: actions/upload-artifact@v4
        with:
          name: life-preview
          path: |
            output/life/*.mp4
            output/life/*_thumb.jpg
            output/life/*_meta*.json
          retention-days: 7
          if-no-files-found: ignore
